<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <style>
    .header { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
    .stat { font: 700 28px 'Segoe UI', Ubuntu, Sans-Serif; fill: #bf91f7; }
    .subtext { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdf8; }
    .fire { font: 700 28px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ff9e64; }
    .border { rx: 10px; fill: #1a1b26; stroke: #38bdf8; stroke-width: 1px; }
  </style>

  <!-- Background Card -->
  <rect class="border" x="0.5" y="0.5" width="494" height="194" />

  <!-- Section 1: Total Contributions -->
  <g transform="translate(15, 0)">
    <text class="header" x="65" y="48" text-anchor="middle">Total Contributions</text>
    <text class="stat" x="65" y="95" text-anchor="middle">1,983</text>
    <text class="subtext" x="65" y="145" text-anchor="middle">Jan 14 - Present</text>
  </g>

  <!-- Divider 1 -->
  <line x1="165" y1="25" x2="165" y2="170" stroke="#2ac3de" stroke-opacity="0.3" stroke-width="1" />

  <!-- Section 2: Current Streak -->
  <g transform="translate(165, 0)">
    <circle cx="82.5" cy="55" r="28" fill="#2ac3de" fill-opacity="0.1" />
    <path d="M 82.5 37 C 82.5 37 72 49 72 58 C 72 64.5 76.5 69 82.5 69 C 88.5 69 93 64.5 93 58 C 93 49 82.5 37 82.5 37 Z" fill="#ff9e64" />
    <text class="stat" x="82.5" y="112" text-anchor="middle">111</text>
    <text class="header" x="82.5" y="138" text-anchor="middle">Current Streak</text>
    <text class="subtext" x="82.5" y="160" text-anchor="middle">May 7 - Aug 25</text>
  </g>

  <!-- Divider 2 -->
  <line x1="330" y1="25" x2="330" y2="170" stroke="#2ac3de" stroke-opacity="0.3" stroke-width="1" />

  <!-- Section 3: Longest Streak -->
  <g transform="translate(330, 0)">
    <text class="stat" x="82.5" y="95" text-anchor="middle">111</text>
    <text class="header" x="82.5" y="130" text-anchor="middle">Longest Streak</text>
    <text class="subtext" x="82.5" y="155" text-anchor="middle">May 7 - Aug 25</text>
  </g>
</svg>